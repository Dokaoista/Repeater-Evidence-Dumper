plugins {
    id 'java'
}

repositories {
    mavenCentral()
}

dependencies {
    // Provided by Burp's classloader at runtime, so it never goes into the final jar.
    compileOnly 'net.portswigger.burp.extensions:montoya-api:2025.5'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

jar {
    archiveBaseName = 'repeater-evidence-dumper'
    archiveVersion = ''
}
